name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  QT_VERSION: "6.10.0"

jobs:
  package:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
          - arch: arm64
            runner: windows-11-arm
            qt_arch: win64_msvc2022_arm64
            cmake_arch: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "0.1.${{ github.run_number }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The package version must contain exactly three numeric parts: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build-release
          -G "Visual Studio 17 2022"
          -A "${{ matrix.cmake_arch }}"
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/release"

      - name: Build
        shell: pwsh
        run: cmake --build build-release --config Release --parallel

      - name: Create self-contained release directory
        shell: pwsh
        run: cmake --install build-release --config Release

      - name: Verify release directory
        shell: pwsh
        run: |
          $required = @(
            "release/bin/appsdk_version_manager.exe",
            "release/bin/svm.exe",
            "release/bin/Qt6Core.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required release file: $path"
            }
          }

          $platformPlugin = Get-ChildItem `
            -Path "release" `
            -Filter "qwindows.dll" `
            -File `
            -Recurse | Select-Object -First 1
          if (-not $platformPlugin) {
            Get-ChildItem -Path "release" -File -Recurse |
              ForEach-Object { $_.FullName }
            throw "Missing required Qt platform plugin: qwindows.dll"
          }
          Write-Host "Qt platform plugin: $($platformPlugin.FullName)"

      - name: Create portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "release/*" `
            -DestinationPath "dist/SVM-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip"

      - name: Create NSIS installer from release directory
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "makensis.exe was not found"
          }

          $releaseDir = (Resolve-Path "release").Path
          $outputFile = (Join-Path (Resolve-Path "dist").Path `
            "SVM-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe")

          & $makensis `
            "/DAPP_VERSION=${{ steps.version.outputs.version }}" `
            "/DAPP_ARCH=${{ matrix.arch }}" `
            "/DRELEASE_DIR=$releaseDir" `
            "/DOUTPUT_FILE=$outputFile" `
            "installer/windows/installer.nsi"

          if ($LASTEXITCODE -ne 0) {
            throw "NSIS failed with exit code $LASTEXITCODE"
          }

      - name: Stage packages for publishing
        uses: actions/upload-artifact@v4
        with:
          name: SVM-windows-${{ matrix.arch }}-packages
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packages from all architectures
        uses: actions/download-artifact@v4
        with:
          pattern: SVM-windows-*-packages
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $expected = @(
            "SVM-$version-windows-x64-portable.zip",
            "SVM-$version-windows-x64-setup.exe",
            "SVM-$version-windows-arm64-portable.zip",
            "SVM-$version-windows-arm64-setup.exe"
          )

          foreach ($name in $expected) {
            $path = Join-Path "release-assets" $name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing GitHub Release asset: $path"
            }
          }

      - name: Create GitHub Release and upload files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --title "SDK Version Manager ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
